name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npx tsc --noEmit

  integration:
    name: Sheets + Drive integration tests
    runs-on: ubuntu-latest
    # Runs against dedicated test spreadsheets/Drive folders only (never the real Signups
    # sheet, photos folder, or Fall 2025 roster). See docs/TEST_DESIGN.md. Each suite
    # skips itself (via its own skipIf) if its secrets aren't configured, so this job never
    # fails a fork PR that can't see them.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          SIGNUPS_SHEET_ID_TEST: ${{ secrets.SIGNUPS_SHEET_ID_TEST }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          PHOTOS_FOLDER_ID_TEST: ${{ secrets.PHOTOS_FOLDER_ID_TEST }}
          FALL_2025_ROSTER_SHEET_ID_TEST: ${{ secrets.FALL_2025_ROSTER_SHEET_ID_TEST }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
